<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>SeanChat</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='17' fill='%233b82f6'/%3E%3Cpath d='M32 12.5c-11.3 0-20.5 7.6-20.5 17.3 0 5.3 2.7 10 7 13.2l-2.3 8.5 9.3-4.8c2 .6 4.2.9 6.5.9 11.3 0 20.5-7.7 20.5-17.8 0-9.7-9.2-17.3-20.5-17.3z' fill='%23fff'/%3E%3C/svg%3E">
<style>
:root{--bg:#0a0e15;--panel:#121822;--text:#e6ebf2;--muted:#8b97a8;--blue:#3b82f6;--blue2:#69a4ff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:16px Roboto,system-ui,-apple-system,"Segoe UI",sans-serif}
body{display:grid;place-items:center;padding:16px;background:radial-gradient(ellipse at 50% 20%,#14223c 0%,var(--bg) 60%)}
.card{width:100%;max-width:380px;text-align:center;padding:36px 28px;border-radius:24px;background:var(--panel);border:1px solid #1f2836}
.mark{width:88px;height:88px;margin:0 auto 18px;filter:drop-shadow(0 8px 24px rgba(59,130,246,.35))}
h1{margin:0 0 10px;font-size:34px;font-weight:800;letter-spacing:-.5px}
h1 b{color:var(--blue2)}
p{margin:0 0 26px;color:var(--muted);line-height:1.5}
button{width:100%;padding:16px;border:0;border-radius:999px;background:var(--blue);color:#fff;font:700 18px inherit;cursor:pointer}
button:hover{background:#2f74e6}
button:focus-visible{outline:3px solid var(--blue2);outline-offset:3px}
.small{margin:18px 0 0;font-size:13px}
.small a{color:var(--blue2)}
</style></head>
<body>
<main class="card">
  <svg class="mark" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="17" fill="#3b82f6"/><path d="M32 12.5c-11.3 0-20.5 7.6-20.5 17.3 0 5.3 2.7 10 7 13.2l-2.3 8.5 9.3-4.8c2 .6 4.2.9 6.5.9 11.3 0 20.5-7.7 20.5-17.8 0-9.7-9.2-17.3-20.5-17.3z" fill="#fff"/><path d="M38.6 23.6c-1.5-1.5-3.9-2.4-6.6-2.4-3.9 0-6.5 1.9-6.5 4.6 0 6.2 13.6 3.3 13.6 9.6 0 3-2.9 5.1-7.1 5.1-2.9 0-5.6-1-7.3-2.9" fill="none" stroke="#3b82f6" stroke-width="4.4" stroke-linecap="round"/></svg>
  <h1>Sean<b>Chat</b></h1>
  <p><b style="color:#69a4ff">Down for maintenance.</b> We're adding new stuff. SeanChat will be back soon, and your friends, chats and streaks are safe.</p>
</main>
<script>
// SeanChat needs the camera and microphone, which embedded pages (like the HALFLIT Google Site) block,
// so it opens in its own phone-sized window.
var URL_ = new URL('seanchat/', location.href).href;
var _b = document.getElementById('open'); if (_b) _b.onclick = function () {
  var h = Math.min(900, (screen.availHeight || 900) - 40), w = Math.min(460, Math.round(h * 0.52));
  var win = window.open(URL_, 'seanchat', 'popup,width=' + w + ',height=' + h + ',left=' + Math.max(0, ((screen.availWidth || 1366) - w) / 2) + ',top=10');
  if (!win) window.open(URL_, '_blank');
};
</script>
</body></html>
