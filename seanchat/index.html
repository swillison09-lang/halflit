<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>SeanChat - down for maintenance</title>
<meta name="theme-color" content="#0a0e15">
<style>
:root{--bg:#0a0e15;--panel:#121822;--text:#e6ebf2;--muted:#8b97a8;--blue:#3b82f6;--blue2:#69a4ff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:16px Roboto,system-ui,-apple-system,"Segoe UI",sans-serif}
body{display:grid;place-items:center;padding:16px;background:radial-gradient(ellipse at 50% 20%,#14223c 0%,var(--bg) 60%)}
.card{width:100%;max-width:420px;text-align:center;padding:36px 28px;border-radius:24px;background:var(--panel);border:1px solid #1f2836}
svg{width:84px;height:84px;margin:0 auto 18px;display:block;filter:drop-shadow(0 8px 24px rgba(59,130,246,.35))}
h1{margin:0 0 6px;font-size:30px;font-weight:800}
h1 b{color:var(--blue2)}
h2{margin:0 0 14px;font-size:18px;font-weight:600;color:var(--blue2)}
p{margin:0 0 12px;color:var(--muted);line-height:1.5}
</style></head>

<h1>Sean<b>Chat</b></h1>
<h2>Down for maintenance</h2>
<p>We're working on SeanChat and adding new stuff. It'll be back soon.</p>
<p>Don't worry: your friends, chats, streaks and everything you saved are safe.</p>
</main></body></html>
