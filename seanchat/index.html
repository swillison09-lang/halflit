.sv-head .glass { flex: none; }


/* ---- REELS: a friends-only feed of short videos. The Reels tab is the shell's fourth page; on a phone the video fills the page (the header floats over it); from 900px
   wide the reel is a 9:16 frame in the middle of the main card. One reel per screen, snapped; only the current and the next reel have a <video> at all. */
.reels-page { background: var(--bg-deep); position: relative; }
.reel-stage { flex: 1; min-height: 0; display: flex; justify-content: center; background: #000; }
.reel-frame { position: relative; width: 100%; height: 100%; background: #000; overflow: hidden; }
.reel-scroll { height: 100%; overflow-y: auto; scroll-snap-type: y mandatory; overscroll-behavior: contain; scrollbar-width: none; }
.reel-scroll::-webkit-scrollbar { display: none; }
.reel-slide { position: relative; height: 100%; scroll-snap-align: start; scroll-snap-stop: always; overflow: hidden; background: #000; color: #fff; cursor: pointer; user-select: none; }
.reel-media { position: absolute; inset: 0; }
.reel-video { width: 100%; height: 100%; object-fit: cover; display: block; background: #000; }
.reel-video.contain { object-fit: contain; }
.reel-poster { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: radial-gradient(120% 80% at 50% 30%, #1a2233, #05070b); color: rgba(255, 255, 255, .7); font-size: 14px; }
.reel-shade { position: absolute; left: 0; right: 0; bottom: 0; height: 48%; background: linear-gradient(to top, rgba(0, 0, 0, .78), rgba(0, 0, 0, 0)); pointer-events: none; }
.reel-top { position: absolute; top: 68px; right: 12px; z-index: 2; display: flex; gap: 8px; }
.reel-hint { position: absolute; left: 50%; top: 72px; transform: translateX(-50%); z-index: 2; display: flex; align-items: center; gap: 7px; padding: 6px 13px; border-radius: 999px; background: rgba(0, 0, 0, .52); font-size: 13px; font-weight: 700; pointer-events: none; }
.reel-paused { position: absolute; left: 50%; top: 50%; z-index: 2; width: 78px; height: 78px; margin: -39px 0 0 -39px; border-radius: 50%; background: rgba(0, 0, 0, .5); display: flex; align-items: center; justify-content: center; font-size: 38px; pointer-events: none; }
.reel-info { position: absolute; left: 14px; right: 84px; bottom: 20px; z-index: 2; display: flex; flex-direction: column; gap: 9px; }
.reel-who { display: flex; align-items: center; gap: 9px; }
.reel-author { display: inline-flex; align-items: center; gap: 9px; background: none; border: 0; padding: 0; color: #fff; font-weight: 700; font-size: 15.5px; text-shadow: 0 1px 4px rgba(0, 0, 0, .7); }
.reel-author .avatar { width: 38px; height: 38px; font-size: 15px; box-shadow: 0 0 0 2px rgba(255, 255, 255, .85); }
.reel-when { font-size: 13px; color: rgba(255, 255, 255, .78); text-shadow: 0 1px 3px rgba(0, 0, 0, .7); }
.reel-caption { margin: 0; font-size: 15px; line-height: 1.38; text-shadow: 0 1px 4px rgba(0, 0, 0, .75); overflow-wrap: anywhere; max-height: 6.2em; overflow-y: auto; scrollbar-width: none; }
.reel-stats { align-self: flex-start; display: inline-flex; align-items: center; gap: 2px; padding: 6px 12px; border: 0; border-radius: 999px; background: rgba(0, 0, 0, .46); color: #fff; font-size: 13px; font-weight: 700; }
.reel-stats .dot { opacity: .6; margin: 0 3px; } .reel-stats .ico { color: #ff8fa3; margin-right: 3px; } .reel-stats .ico + span + .dot + .ico { color: #fff; }
.reel-rail { position: absolute; right: 8px; bottom: 22px; z-index: 2; display: flex; flex-direction: column; align-items: center; gap: 12px; }
.reel-act { background: none; border: 0; color: #fff; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 12px; font-weight: 700; text-shadow: 0 1px 3px rgba(0, 0, 0, .7); padding: 0; }
.reel-ico { width: 46px; height: 46px; border-radius: 50%; background: rgba(16, 20, 28, .58); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .16); display: inline-flex; align-items: center; justify-content: center; font-size: 25px; transition: background-color .15s, transform .1s; }
.reel-act:hover .reel-ico { background: rgba(16, 20, 28, .8); } .reel-act:active .reel-ico { transform: scale(.92); }
.reel-act.on .reel-ico { color: #ff4d6d; }
.reel-act.reel-pop .reel-ico { animation: heartpop .38s var(--ease); }
.reel-act:focus-visible .reel-ico, .reel-author:focus-visible, .reel-stats:focus-visible { outline: 2px solid var(--accent-hi); outline-offset: 2px; }
.reel-progress { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: rgba(255, 255, 255, .24); z-index: 3; pointer-events: none; }
.reel-bar { height: 100%; background: #fff; transform-origin: 0 50%; transition: transform .25s linear; will-change: transform; }
.reel-replybar { position: absolute; left: 10px; right: 10px; bottom: 12px; z-index: 4; display: flex; align-items: center; gap: 8px; }
.reel-replybar .field { flex: 1; min-width: 0; height: 46px; border-radius: 999px; padding: 0 18px; background: rgba(0, 0, 0, .6); border-color: rgba(255, 255, 255, .34); color: #fff; }
.reel-slide.replying .reel-rail, .reel-slide.replying .reel-info { visibility: hidden; }
.reel-slide.failed .reel-loading { color: #ffb3b9; }
.reels-empty { margin: auto; max-width: 340px; }
.reel-single-wrap { position: relative; flex: 1; min-height: 0; display: flex; justify-content: center; background: #000; }
.reel-frame.single { max-width: 480px; }
.reel-close { position: absolute; top: 12px; right: 12px; z-index: 6; }
.reel-ov .reel-top { top: 12px; right: 64px; }
.reel-ov .reel-hint { top: 18px; }
/* the header floats over the video on a phone */
.reels-page .app-head { position: absolute; top: 0; left: 0; right: 0; z-index: 5; background: linear-gradient(to bottom, rgba(0, 0, 0, .55), rgba(0, 0, 0, 0)); color: #fff; pointer-events: none; }
.reels-page .app-head > * { pointer-events: auto; }
.reels-page .app-head .head-title { text-shadow: 0 1px 4px rgba(0, 0, 0, .6); }
.reel-post-btn { background: rgba(0, 0, 0, .36); color: #fff; }
.reel-post-btn:hover { background: rgba(0, 0, 0, .55); }
.reel-menu { gap: 4px; padding: 10px; }
.reel-menu .menu-item { display: flex; align-items: center; gap: 12px; width: 100%; padding: 13px 14px; border: 0; border-radius: 12px; background: none; color: var(--text); font-size: 16px; font-weight: 600; text-align: left; }
.reel-menu .menu-item:hover { background: var(--panel2); } .reel-menu .menu-item.danger { color: #ff7b83; }
.ico-heart { color: #ff4d6d; }
/* posting a reel */
.reel-compose { width: min(480px, 100%); gap: 12px; }
.reel-compose-head { display: flex; align-items: center; gap: 8px; }
.reel-compose-body { display: flex; flex-direction: column; gap: 12px; min-height: 120px; }
.reel-compose-body p { margin: 0; }
.reel-choices { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.reel-choices:has(> :only-child) { grid-template-columns: 1fr; }
.reel-choice { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 22px 12px; border: 1px solid var(--line2); border-radius: 18px; background: var(--panel2); color: var(--text); text-align: center; }
.reel-choice:hover { background: var(--panel3); border-color: var(--accent); }
.reel-choice-ico { width: 52px; height: 52px; border-radius: 50%; background: var(--accent-soft); color: var(--accent-hi); display: inline-flex; align-items: center; justify-content: center; font-size: 26px; }
.reel-bar-wrap { height: 10px; border-radius: 999px; background: var(--panel3); overflow: hidden; }
.reel-bar-fill { height: 100%; width: 0; background: var(--accent); border-radius: 999px; transition: width .2s linear; }
.reel-preview-wrap, .reel-live-wrap { display: flex; justify-content: center; background: #000; border-radius: 16px; overflow: hidden; }
.reel-preview, .reel-live { display: block; width: 100%; max-height: 46vh; background: #000; object-fit: contain; }
.reel-live { transform: scaleX(-1); }
.reel-cap-row { display: flex; align-items: center; gap: 10px; }
.reel-cap-row .field { flex: 1; }
.reel-timer { font-variant-numeric: tabular-nums; color: var(--muted); font-weight: 700; }
.rep-reel { max-width: 320px; max-height: 420px; background: #000; }
/* a reply to (or a share of) a reel in a chat */
.story-tag.reel-tag { align-items: center; gap: 10px; padding: 8px 10px; margin-bottom: 6px; border: 0; border-radius: 12px; background: rgba(255, 255, 255, .06); color: var(--text); text-align: left; width: 100%; font: inherit; font-size: 13px; }
button.story-tag.reel-tag { cursor: pointer; } button.story-tag.reel-tag:hover { background: rgba(255, 255, 255, .11); }
.reel-tag-ico { width: 38px; height: 38px; border-radius: 10px; background: linear-gradient(150deg, var(--accent-lo), var(--story)); color: #fff; display: inline-flex; align-items: center; justify-content: center; font-size: 19px; flex: none; }
.reel-tag .st-watch { margin-left: auto; font-weight: 800; color: var(--accent-hi); }
.reel-tag.expired { color: var(--muted); }
@media (min-width: 900px) {
  .reels-page.page { grid-area: 1 / 2; margin: var(--gap) var(--main-r) var(--gap) 0; border-radius: var(--card-r); background: transparent; overflow: hidden; }
  .shell:not([data-page="3"]) .reels-page { display: none; }
  .reels-page .app-head { position: static; background: none; pointer-events: auto; color: var(--text); min-height: 56px; }
  .reels-page .app-head .head-title { text-shadow: none; }
  .reel-post-btn { background: var(--accent); color: #fff; } .reel-post-btn:hover { background: var(--accent-hover); }
  .reel-stage { background: transparent; padding-bottom: 12px; }
  .reel-frame { width: auto; aspect-ratio: 9 / 16; max-width: 100%; border-radius: 20px; box-shadow: 0 18px 50px rgba(0, 0, 0, .45); }
  .reel-top { top: 12px; }
  .reel-hint { top: 18px; }
  .reel-frame.single { aspect-ratio: auto; width: 100%; border-radius: 0; box-shadow: none; }
  .reel-single-wrap { padding: 16px 0; }
  .reel-single-wrap .reel-frame.single { aspect-ratio: 9 / 16; width: auto; border-radius: 20px; }
  .reel-ov .reel-close { top: 20px; right: 20px; }
}
@media (prefers-reduced-motion: reduce) { .reel-act.reel-pop .reel-ico { animation: none; } .reel-bar { transition: none; } }
